get_schedules:
  fields:
    config_entry_id:
      required: false
      example: 01JABCDEF0123456789
      selector:
        config_entry:
          integration: kumo_cloud

set_season:
  fields:
    season:
      required: true
      example: Default
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: kumo_cloud

set_schedules_enabled:
  fields:
    enabled:
      required: true
      selector:
        boolean:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: kumo_cloud

clear_season_events:
  fields:
    season:
      required: false
      example: Default
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: kumo_cloud

set_hold:
  fields:
    enabled:
      required: true
      selector:
        boolean:
    zone:
      required: false
      example: Den
      selector:
        text:
    hold_type:
      required: false
      selector:
        select:
          options:
            - until_next_event
            - permanent
    operation_mode:
      required: false
      selector:
        select:
          # Quoted deliberately. Unquoted, YAML reads `off` as the boolean
          # false, and hassfest then sees a null where a string belongs.
          options: ["cool", "heat", "dry", "vent", "auto", "off"]
    cool_setpoint:
      required: false
      selector:
        number:
          min: 10
          max: 32
          step: 0.5
          unit_of_measurement: "°C"
    heat_setpoint:
      required: false
      selector:
        number:
          min: 10
          max: 32
          step: 0.5
          unit_of_measurement: "°C"
    fan_speed:
      required: false
      selector:
        text:
    air_direction:
      required: false
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: kumo_cloud

set_schedule:
  fields:
    zone:
      required: true
      example: Den
      selector:
        text:
    events:
      required: true
      example: >-
        [{"days": ["Mo", "Tu", "We", "Th", "Fr"], "start_time": "0715",
          "operation_mode": "cool", "cool_setpoint": 22.0, "heat_setpoint": 19.0}]
      selector:
        object:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: kumo_cloud

set_auto_dry:
  fields:
    enabled:
      required: true
      selector:
        boolean:
    zone:
      required: false
      example: Den
      selector:
        text:
    target_humidity:
      required: false
      example: 50
      selector:
        number:
          min: 30
          max: 80
          step: 1
          unit_of_measurement: "%"
    overcool:
      required: false
      example: 2
      selector:
        number:
          min: 0
          max: 10
          step: 1
    offset:
      required: false
      example: 0
      selector:
        number:
          min: -10
          max: 10
          step: 1
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: kumo_cloud
