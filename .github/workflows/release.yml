name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create ZIP file
        run: |
          cd custom_components
          zip -r ../kumo_cloud.zip kumo_cloud/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: kumo_cloud.zip
